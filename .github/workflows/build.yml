name: Build Game (Android + Web)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GODOT_VERSION: "3.5.2"
  EXPORT_NAME: "HeadShooter"

jobs:
  export:
    name: Export Android APK & Web build
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:3.5.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Export Templates setup
      - name: Move export templates into place
        run: |
          mkdir -pv ~/.local/share/godot/templates
          mkdir -pv ~/.local/share/godot/export_templates
          if [ -d "/root/.local/share/godot/templates/${GODOT_VERSION}.stable" ]; then
            mv "/root/.local/share/godot/templates/${GODOT_VERSION}.stable" ~/.local/share/godot/templates/
          fi
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
          fi

      # 2. Debug Keystore Auto-generate karna
      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # 3. Godot Editor Settings Configured karna (Android SDK + Keystore paths)
      - name: Configure Godot Android Settings
        run: |
          mkdir -pv ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-3.tres
          [gd_resource type="EditorSettings" format=2]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Create build output folders
        run: |
          mkdir -pv build/android
          mkdir -pv build/web

      # 4. Project import & cache build
      - name: Prepare Godot Project
        run: |
          godot --headless --editor --quit || true

      - name: Export Android APK (debug-signed, install-ready)
        run: |
          godot --verbose --export-debug "Android" "build/android/${EXPORT_NAME}.apk"

      - name: Export Web build (HTML5 / WebGL 1.0)
        run: |
          godot --verbose --export-debug "Web" "build/web/index.html"

      - name: Zip the Web build
        run: |
          cd build/web
          zip -r "../${EXPORT_NAME}-Web.zip" .

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-Android-APK
          path: build/android/${{ env.EXPORT_NAME }}.apk
          if-no-files-found: error

      - name: Upload Web build artifact (zipped)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-Web
          path: build/${{ env.EXPORT_NAME }}-Web.zip
          if-no-files-found: error
